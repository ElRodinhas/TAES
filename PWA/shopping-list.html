<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Smart Pantry - Lista de Compras</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">Smart Pantry</div>
            <nav class="recipe-nav">
                <a href="./pantry.html" class="button button-secondary">Despensa</a>
                <a href="./recipes.html" class="button button-secondary">Receitas</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <h1>A Minha Lista de Compras 🛒</h1>

        <p id="shopping-list-msg" role="alert" hidden></p>

        <div class="form-card">
            <ul id="shopping-list-container" style="list-style: none; padding: 0;"></ul>

            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button id="btn-open-batch-transfer" type="button" class="button button-primary">
                    Transferir Selecionados para a Despensa
                </button>
            </div>
        </div>

        <section id="batch-transfer-section" class="form-card" style="margin-top: 20px;" hidden>
            <h2>Transferir para a Despensa</h2>
            <p>Define a quantidade, categoria e data de validade para cada produto comprado:</p>
            <div id="batch-transfer-items"></div>

            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button id="btn-confirm-batch-transfer" type="button" class="button button-primary">
                    Confirmar Transferência
                </button>
                <button id="btn-cancel-batch-transfer" type="button" class="button button-secondary">
                    Cancelar
                </button>
            </div>
        </section>
    </main>

    <script src="./shopping-list.js"></script>
</body>
</html>
