<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Smart Pantry - Lista de Compras</title>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">Smart Pantry</div>
            <nav class="recipe-nav">
                <a href="./pantry.html" class="button button-secondary">Despensa</a>
                <a href="./recipes.html" class="button button-secondary">Receitas</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <h1>A Minha Lista de Compras 🛒</h1>
        <div class="form-card" style="margin-bottom: 20px;">
            <h3>Adicionar Item Manualmente</h3>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="input-item-name" placeholder="Nome do item" style="flex: 2; padding: 8px;">
                <input type="number" id="input-item-qty" value="1" min="1" style="flex: 1; padding: 8px;">
                <button id="btn-add-item" class="button button-primary">Adicionar</button>
            </div>
        </div>
        <div class="form-card">
            <ul id="shopping-list-container" style="list-style: none; padding: 0;"></ul>
        </div>
    </main>

    <script src="./shopping-list.js"></script>
</body>
</html>
