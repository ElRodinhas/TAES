<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17352b">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
    <title>Smart Pantry - Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="brand" aria-label="Smart Pantry">Smart Pantry</div>
        </div>
    </header>

    <div class="main">
        <div id="scanner-screen">
            <div id="camera-container">
                <div class="intro">
                    <h1 id="scanner-title">SmartPantry - Scanner de Produtos</h1>
                    <p>Aponte a câmara para o código de barras ou insira os dados manualmente:</p>
                    <div id="reader"></div>
                    <div id="restart-scanner-container" style="margin-top: 15px; display: none; text-align: center;">
                        <button type="button" id="restart-scanner-btn" class="button button-primary">Ler outro
                            produto</button>

                    </div>
                </div>

                <!-- Seletor de Câmara para resolver o problema da lente 0.5x -->
                <div id="camera-selection-container"
                    style="margin-top: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
                    <label for="camera-select" style="font-size: 14px; font-weight: bold;">Se a imagem estiver desfocada
                        (0.5x), mude a câmara:</label>
                    <select id="camera-select"
                        style="width: 100%; margin-top: 8px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                       
                    </select>
                </div>

                <button type="button" id="btn-force-fallback" class="button button-secondary"
                    style="margin-top: 15px; width: 100%;">
                    A câmara não funciona? Usar alternativas
                </button>
            </div>
        </div>

        <div id="fallback-container"
            style="display: none; margin-top: 15px; background: #fff4e5; padding: 15px; border-radius: 8px;">

            <p style="color: #d97706; font-weight: bold; margin-bottom: 15px;">
                A câmara não está disponível. Use uma das seguintes opções:
            </p>
            <div class="field" style="margin-top: 15px;">
                <h3>Opção 1: Upload de Imagem</h3>
                <div class="field">
                    <input type="file" id="barcodeFile" accept="image/*" capture="environment">
                </div>
            </div>

            <div class="form-card" style="margin-top: 15px;">
                <h3>Opção 2: Inserir Código Manual</h3>
                <div class="field">
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="manualBarcode" data-testid="manual-barcode-input"
                            placeholder="Ex: 5601234567890" style="flex: 1;">
                        <button type="button" id="lookupBarcodeBtn" class="button button-secondary"
                            onclick="manualLookup()">Procurar</button>
                    </div>
                </div>
            </div>
        </div>

        <p id="scanner-msg" role="alert" hidden style="margin-top: 15px; font-weight: bold; color: #d97706;"></p>

        <div class="result-box" id="formContainer" style="display:none; margin-top: 15px;">
            <h3>Validar Produto</h3>
            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="field">
                    <label>Código de Barras:</label>
                    <input type="text" id="barcodeVal" data-testid="barcode-input">
                </div>
                <div class="field">
                    <label>Nome do Produto:</label>
                    <input type="text" id="productName" data-testid="input-item-name">
                </div>
                <div class="field">
                    <label>Categoria:</label>
                    <input type="text" id="productCategory" data-testid="input-item-category">
                </div>
                <div class="field">
                    <label>Quantidade:</label>
                    <input type="number" id="productQty" data-testid="input-item-qty" value="1" min="1">
                </div>
                <div class="field">
                    <label>Data de Validade:</label>
                    <input type="date" id="productExpiry" data-testid="input-item-expiry">
                </div>
                <button type="submit" id="btn-save-item" data-testid="btn-save-item" class="button button-primary"
                    style="margin-bottom: 15px;">Guardar na Despensa</button>

                <button type="button" id="cancel-scanner" class="button button-secondary"
                    style="margin-top: 15px;">Cancelar</button>
                <p id="form-msg" role="alert" hidden></p>
            </form>
        </div>
    </div>
    </main>

    <!-- O scanner.js TEM de estar aqui -->
    <script src="./scanner.js"></script>
</body>

</html>
